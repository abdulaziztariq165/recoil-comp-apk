name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Sign APK
        run: |
          keytool -genkeypair -v \
            -keystore release.jks \
            -alias recoilcomp \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass alpharecoil -keypass alpharecoil \
            -dname "CN=RecoilComp, OU=Alpha, O=Alpha, L=ID, C=ID"
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n 1)
          $ANDROID_HOME/build-tools/$BT/apksigner sign \
            --ks release.jks \
            --ks-pass pass:alpharecoil \
            --key-pass pass:alpharecoil \
            --out app-debug-signed.apk "$APK"
          $ANDROID_HOME/build-tools/$BT/apksigner verify --verbose app-debug-signed.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: recoil-comp-debug
          path: app-debug-signed.apk

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Recoil Comp v1.0.${{ github.run_number }}"
          files: app-debug-signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
