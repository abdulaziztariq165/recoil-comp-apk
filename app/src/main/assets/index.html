<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Alpha Recoil Simulator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  
  /* الخلفية الافتراضية للتطبيق (رمادي غامق) */
  body {
    background: linear-gradient(180deg, #1a2332 0%, #0d1117 100%) !important; 
    color: #c9d1d9;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    touch-action: none; overscroll-behavior: none;
  }

  #viewport {
    position: fixed; inset: 0;
    background: transparent; /* شفاف عشان ياخد لون الـ body */
    overflow: hidden;
  }

  /* كلاس الـ Overlay: بيشتغل أوتوماتيك لما يفتح فوق اللعبة */
  body.in-overlay {
    background: transparent !important;
  }
  body.in-overlay #viewport {
    pointer-events: none; /* يخلي اللمس يعدي للعبة */
  }
  /* الزراير بس اللي بتستقبل اللمس في وضع الـ Overlay */
  body.in-overlay #fireBtn, body.in-overlay #configFab, 
  body.in-overlay #miniPanel, body.in-overlay #configPanel {
    pointer-events: auto;
  }

  #crosshair {
    position: absolute; width: 40px; height: 40px;
    transform: translate(-50%, -50%);
    pointer-events: none; z-index: 10;
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: #33ff66; box-shadow: 0 0 6px #33ff66;
  }
  #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
  #crosshair::after { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }
  #crosshair .dot {
    position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; background: #33ff66;
    border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 8px #33ff66;
  }
  #viewport.hide-cross #crosshair { opacity: 0; }

  /* الأزرار العائمة */
  #fireBtn {
    position: absolute; width: 96px; height: 96px; border-radius: 50%;
    background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.5);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 28px; color: #fff; padding: 0; z-index: 20;
    transition: background 0.08s, border-color 0.08s, transform 0.08s;
  }
  #fireBtn .fbLabel { font-size: 9px; margin-top: 2px; font-weight: 600; opacity: 0.85; }
  #fireBtn.state-FREE { background: rgba(255,180,0,0.18); border-color: rgba(255,180,0,0.7); }
  #fireBtn.state-FREE .fbLabel { color: #ffb400; }
  #fireBtn.state-MOVING { background: rgba(51,153,255,0.22); border: 2px dashed rgba(51,153,255,0.9); }
  #fireBtn.state-MOVING .fbLabel { color: #3399ff; }
  #fireBtn.state-LOCKED { background: rgba(51,255,102,0.18); border-color: rgba(51,255,102,0.8); }
  #fireBtn.state-LOCKED .fbLabel { color: #33ff66; }
  #fireBtn.firing { background: rgba(51,255,102,0.85) !important; border-color: #00aa33 !important; transform: scale(0.94); }

  #installBtn {
    position: absolute; top: -48px; left: 50%; transform: translateX(-50%);
    display: none; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 20px;
    background: rgba(51,153,255,0.92); border: 2px solid #3399ff;
    color: #fff; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; z-index: 25;
  }
  #fireBtn.pill-below #installBtn { top: auto; bottom: -48px; }
  #fireBtn.state-MOVING #installBtn { display: flex; }

  #configFab {
    position: absolute; top: 14px; left: 14px; width: 48px; height: 48px; border-radius: 50%;
    background: rgba(51,255,102,0.15); border: 2px solid rgba(51,255,102,0.7);
    color: #33ff66; font-size: 22px; padding: 0; display: flex; align-items: center; justify-content: center;
    z-index: 100; cursor: pointer;
  }
  #configFab.open { background: rgba(51,255,102,0.55); color: #0d1117; transform: rotate(45deg); }

  #configPanel {
    position: absolute; top: 72px; left: 14px; width: min(270px, calc(100vw - 28px));
    max-height: calc(100vh - 90px); overflow-y: auto;
    background: rgba(13,17,23,0.95); border: 1px solid rgba(51,255,102,0.4);
    border-radius: 10px; padding: 14px; z-index: 99; direction: ltr; text-align: left;
    transform-origin: top left; transform: scale(0.85) translateY(-8px);
    opacity: 0; visibility: hidden; transition: all 0.18s;
  }
  #configPanel.open { transform: scale(1) translateY(0); opacity: 1; visibility: visible; }
  #configPanel h3 { font-size: 11px; color: #33ff66; text-transform: uppercase; margin-bottom: 4px; border-bottom: 1px solid rgba(51,255,102,0.2); padding-bottom: 6px; }

  .slrow label { display: block; font-size: 11px; color: #8b949e; margin-top: 10px; margin-bottom: 3px; }
  .slrow input[type=range] { width: 100%; height: 24px; -webkit-appearance: none; background: transparent; }
  .slrow input[type=range]::-webkit-slider-runnable-track { height: 4px; background: #30363d; border-radius: 2px; }
  .slrow input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: #33ff66; border-radius: 50%; margin-top: -6px; }
  .slrow .val { color: #33ff66; font-family: monospace; float: right; font-size: 11px; }

  .panelBtn {
    display: block; width: 100%; margin-top: 10px; padding: 9px 10px; border-radius: 6px;
    font: inherit; font-size: 11px; font-weight: 600; cursor: pointer; border: 1px solid;
    background: rgba(51,255,102,0.1); border-color: rgba(51,255,102,0.5); color: #33ff66;
  }
  .panelBtn.on { background: rgba(51,255,102,0.45); color: #0d1117; }
  .panelBtn.warn { background: rgba(255,80,80,0.1); border-color: rgba(255,80,80,0.5); color: #ff5050; }

  /* القائمة العائمة (Mini Panel) */
  #miniPanel {
    position: absolute; top: 130px; right: 14px; width: 230px;
    background: rgba(13,17,23,0.96); border: 1px solid rgba(51,255,102,0.55);
    border-radius: 12px; z-index: 90; display: none; direction: ltr; text-align: left;
    box-shadow: 0 6px 24px rgba(0,0,0,0.55);
  }
  #miniPanel.show { display: block; }
  #miniPanel .mHead { 
    display: flex; align-items: center; gap: 6px; padding: 8px 10px; 
    border-bottom: 1px solid rgba(51,255,102,0.2); font-size: 11px; color: #33ff66;
    cursor: grab; touch-action: none;
  }
  #miniPanel .mHead:active { cursor: grabbing; }
  #miniPanel .mHead .grow { flex: 1; }
  .mBtn { width: 28px; height: 28px; border-radius: 6px; background: rgba(51,255,102,0.1); border: 1px solid rgba(51,255,102,0.4); color: #33ff66; }
  #miniPanel .mBody { 
    padding: 2px 12px 12px; 
    max-height: 60vh; /* تحديد ارتفاع عشان ينزل سكرول */
    overflow-y: auto; /* تفعيل السكرول */
    touch-action: pan-y; /* السماح بالسحب لتحت */
  }
  #miniPanel.collapsed .mBody { display: none; }

  #hud {
    position: absolute; top: 14px; right: 14px; background: rgba(0,0,0,0.6);
    padding: 10px 14px; border-radius: 8px; font-size: 11px; font-family: monospace;
    line-height: 1.5; direction: ltr; text-align: left; border: 1px solid rgba(51,255,102,0.3);
    pointer-events: none;
  }
  #hud .row { display: flex; justify-content: space-between; gap: 10px; }
  #hud .label { color: #8b949e; }
  #hud .val { color: #33ff66; font-weight: 600; }

  #hint {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.75); padding: 6px 14px; border-radius: 20px;
    font-size: 11px; color: #a3aebb; text-align: center; border: 1px solid rgba(255,255,255,0.1);
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="viewport">
  <div id="crosshair"><div class="dot"></div></div>

  <div id="hud">
    <div class="row"><span class="label">Shots</span><span class="val" id="hudShots">0</span></div>
    <div class="row"><span class="label">Recoil Y</span><span class="val" id="hudY">0.0</span></div>
    <div class="row"><span class="label">Auto</span><span class="val" id="hudAuto">OFF</span></div>
    <div class="row"><span class="label">Gyro</span><span class="val" id="hudGyro">OFF</span></div>
  </div>

  <button id="configFab" aria-label="Settings">⚙</button>

  <!-- القائمة الرئيسية -->
  <div id="configPanel">
    <h3>Recoil Profile</h3>
    <div id="mainSliders"></div>
    <button class="panelBtn" data-toggle="autoComp"></button>
    <button class="panelBtn" data-toggle="cross"></button>
    <button class="panelBtn" data-toggle="target"></button>
    <button class="panelBtn action-btn btn-pip">تفعيل الشاشة العائمة ⧉</button>
    <button class="panelBtn action-btn btn-gyro">GYRO AIM: OFF</button>
    <button class="panelBtn action-btn btn-move">وضع النقل / MOVE</button>
    <button class="panelBtn action-btn btn-reset">إعادة تعيين / RESET</button>
    <button class="panelBtn warn action-btn btn-hide-hud">إخفاء HUD</button>
  </div>

  <!-- القائمة العائمة -->
  <div id="miniPanel">
    <div class="mHead">
      <span class="grow">⚡ Quick</span>
      <button class="mBtn" id="mPip">⧉</button>
      <button class="mBtn" id="mCollapse">–</button>
      <button class="mBtn" id="mClose">✕</button>
    </div>
    <div class="mBody">
      <button class="panelBtn" data-toggle="autoComp"></button>
      <div id="miniSliders"></div>
      <button class="panelBtn" data-toggle="cross"></button>
      <button class="panelBtn" data-toggle="target"></button>
      <button class="panelBtn action-btn btn-pip">تفعيل الشاشة العائمة ⧉</button>
      <button class="panelBtn action-btn btn-gyro">GYRO AIM: OFF</button>
      <button class="panelBtn action-btn btn-move">وضع النقل / MOVE</button>
      <button class="panelBtn action-btn btn-reset">إعادة تعيين / RESET</button>
      <button class="panelBtn warn action-btn btn-hide-hud">إخفاء HUD</button>
    </div>
  </div>

  <div id="fireBtn" class="state-FREE" role="button">
    <span class="fbIcon">🔥</span>
    <span class="fbLabel">FREE</span>
    <button type="button" id="installBtn">📌 تثبيت</button>
  </div>

  <div id="hint">اضغط ⚙ للإعدادات</div>
</div>

<script>
'use strict';

// كشف وضع الـ Overlay (لو شغال من الـ Service)
if (window.NativeOverlay) {
    document.body.classList.add('in-overlay');
}

const state = {
  aimX: 0, aimY: 0, recoilX: 0, recoilY: 0, pendX: 0, pendY: 0, compX: 0, compY: 0,
  noiseX: 0, noiseY: 0, noiseTX: 0, noiseTY: 0, lastNoise: 0, crossX: 0, crossY: 0,
  vPerShot: 6.5, hBias: 0.4, fireInterval: 92, compStrength: 1.0, noiseSigma: 0.6,
  firing: false, autoComp: false, gyroOn: false, showCross: true, showTarget: true, showMini: false,
  lastShot: 0, shots: 0, hits: 0, btnState: 'FREE',
  fireBtnX: 40, fireBtnY: 0, fireBtnSize: 96, dragPtr: null, dragOffsetX: 0, dragOffsetY: 0,
};

const $ = id => document.getElementById(id);
const viewport = $('viewport'), crosshair = $('crosshair'), fireBtn = $('fireBtn');
const configFab = $('configFab'), configPanel = $('configPanel'), mini = $('miniPanel'), hud = $('hud');

let vw = 0, vh = 0, booted = false;

function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

function crossScreen() {
  return { x: vw / 2 + state.crossX, y: vh / 2 - state.crossY };
}

function renderCrosshair() {
  const p = crossScreen();
  crosshair.style.left = p.x + 'px'; crosshair.style.top = p.y + 'px';
}

const SLIDERS = [
  { key: 'vPerShot', label: 'Vertical', min: 0, max: 20, step: 0.5, dec: 1 },
  { key: 'hBias', label: 'Horizontal', min: -3, max: 3, step: 0.1, dec: 1 },
  { key: 'fireInterval', label: 'Interval', min: 40, max: 200, step: 2, dec: 0 },
  { key: 'compStrength', label: 'Comp strength', min: 0, max: 1.5, step: 0.05, dec: 2 },
];
const sliderEls = {};

function setParam(key, v) {
  state[key] = v;
  if (sliderEls[key]) for (const e of sliderEls[key]) {
    e.input.value = v; e.val.textContent = v.toFixed(SLIDERS.find(s=>s.key===key).dec);
  }
}
function buildSliders(container, prefix) {
  for (const d of SLIDERS) {
    const row = document.createElement('div'); row.className = 'slrow';
    const label = document.createElement('label');
    label.appendChild(document.createTextNode(d.label + ' '));
    const val = document.createElement('span'); val.className = 'val'; label.appendChild(val);
    const input = document.createElement('input'); input.type = 'range';
    input.min = d.min; input.max = d.max; input.step = d.step;
    row.appendChild(label); row.appendChild(input); container.appendChild(row);
    if (!sliderEls[d.key]) sliderEls[d.key] = [];
    sliderEls[d.key].push({ input, val });
    input.addEventListener('input', () => setParam(d.key, parseFloat(input.value)));
  }
}
buildSliders($('mainSliders'), 'main-'); buildSliders($('miniSliders'), 'mini-');
SLIDERS.forEach(d => setParam(d.key, state[d.key]));

const TOGGLES = {
  autoComp: { label: 'AUTO COMP', get: () => state.autoComp, set: v => state.autoComp = v },
  cross: { label: 'CROSSHAIR', get: () => state.showCross, set: v => { state.showCross = v; viewport.classList.toggle('hide-cross', !v); } },
  target: { label: 'TARGET', get: () => state.showTarget, set: v => state.showTarget = v },
};

document.querySelectorAll('[data-toggle]').forEach(b => {
  b.addEventListener('click', () => {
    const t = TOGGLES[b.dataset.toggle];
    t.set(!t.get());
    document.querySelectorAll(`[data-toggle="${b.dataset.toggle}"]`).forEach(btn => {
      btn.textContent = t.label + ': ' + (t.get() ? 'ON' : 'OFF');
      btn.classList.toggle('on', t.get());
    });
    $('hudAuto').textContent = state.autoComp ? 'ON' : 'OFF';
  });
});

function applyFireBtnPosition() {
  fireBtn.style.left = state.fireBtnX + 'px'; fireBtn.style.top = state.fireBtnY + 'px';
}
function resize() {
  vw = viewport.clientWidth; vh = viewport.clientHeight;
  if (booted) { applyFireBtnPosition(); renderCrosshair(); }
}
window.addEventListener('resize', resize);

function fireOneShot() {
  const p = crossScreen();
  state.shots++;
  state.pendY += state.vPerShot; state.pendX += state.hBias;
  if (window.NativeOverlay) window.NativeOverlay.injectTap(Math.round(p.x), Math.round(p.y));
}

let lastFrame = performance.now();
function loop(now) {
  const dt = clamp(now - lastFrame, 0, 50); lastFrame = now;
  if (state.firing) {
    let n = 0;
    while (now - state.lastShot >= state.fireInterval && n < 5) { state.lastShot += state.fireInterval; fireOneShot(); n++; }
    if (n === 5) state.lastShot = now;
  }
  const kf = 1 - Math.exp(-dt / 40);
  const kx = state.pendX * kf, ky = state.pendY * kf;
  state.pendX -= kx; state.pendY -= ky; state.recoilX += kx; state.recoilY += ky;

  if (state.firing && state.autoComp) {
    const rate = (state.compStrength * dt) / state.fireInterval;
    state.compY -= state.vPerShot * rate; state.compX -= state.hBias * rate;
  }
  const decay = Math.exp(-dt / 200);
  if (!state.firing || !state.autoComp) { state.recoilX *= decay; state.recoilY *= decay; state.compX *= decay; state.compY *= decay; }

  state.crossX = state.recoilX + state.compX + state.noiseX;
  state.crossY = state.recoilY + state.compY + state.noiseY;
  renderCrosshair(); requestAnimationFrame(loop);
}

function setBtnState(s) {
  state.btnState = s;
  fireBtn.className = 'state-' + s;
  fireBtn.querySelector('.fbLabel').textContent = s;
  document.querySelectorAll('.btn-move').forEach(btn => {
    btn.textContent = s === 'MOVING' ? 'إنهاء النقل / DONE' : 'وضع النقل / MOVE';
    btn.classList.toggle('on', s === 'MOVING');
  });
}

fireBtn.addEventListener('pointerdown', e => {
  if ($('installBtn').contains(e.target)) return; e.preventDefault();
  if (state.btnState === 'MOVING') {
    state.dragPtr = e.pointerId;
    const r = fireBtn.getBoundingClientRect();
    state.dragOffsetX = e.clientX - r.left; state.dragOffsetY = e.clientY - r.top;
    fireBtn.setPointerCapture(e.pointerId);
  } else if (state.btnState === 'LOCKED') {
    fireBtn.setPointerCapture(e.pointerId);
    state.firing = true; state.lastShot = performance.now() - state.fireInterval; fireBtn.classList.add('firing');
  }
});
fireBtn.addEventListener('pointermove', e => {
  if (e.pointerId !== state.dragPtr || state.btnState !== 'MOVING') return; e.preventDefault();
  state.fireBtnX = clamp(e.clientX - state.dragOffsetX, 0, vw - state.fireBtnSize);
  state.fireBtnY = clamp(e.clientY - state.dragOffsetY, 0, vh - state.fireBtnSize);
  applyFireBtnPosition();
});
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => fireBtn.addEventListener(ev, e => {
  if (e.pointerId === state.dragPtr) state.dragPtr = null;
  if (state.btnState === 'LOCKED') { state.firing = false; fireBtn.classList.remove('firing'); }
}));
$('installBtn').addEventListener('pointerdown', e => { e.stopPropagation(); setBtnState('LOCKED'); });

document.querySelectorAll('.btn-move').forEach(btn => btn.addEventListener('click', () => setBtnState(state.btnState === 'MOVING' ? 'FREE' : 'MOVING')));
document.querySelectorAll('.btn-hide-hud').forEach(btn => btn.addEventListener('click', () => { hud.style.display = hud.style.display === 'none' ? 'block' : 'none'; }));
document.querySelectorAll('.btn-reset').forEach(btn => btn.addEventListener('click', () => { Object.assign(state, { aimX: 0, aimY: 0, recoilX: 0, recoilY: 0, pendX: 0, pendY: 0, compX: 0, compY: 0, noiseX: 0, noiseY: 0, shots: 0, hits: 0 }); }));

function closePanel() { configPanel.classList.remove('open'); configFab.classList.remove('open'); }
configFab.addEventListener('click', () => {
  const open = configPanel.classList.toggle('open'); configFab.classList.toggle('open', open);
});

// تفعيل الـ Overlay
document.querySelectorAll('.btn-pip').forEach(btn => btn.addEventListener('click', () => {
  if (window.AndroidBridge) window.AndroidBridge.startOverlay();
  else alert('هذه الميزة تعمل فقط داخل التطبيق (APK)');
}));

// القائمة العائمة والسحب
const mHead = mini.querySelector('.mHead');
let isDragging = false;
mHead.addEventListener('pointerdown', e => {
  if (e.target.closest('button')) return;
  isDragging = true;
  const r = mini.getBoundingClientRect();
  mDrag = { dx: e.clientX - r.left, dy: e.clientY - r.top };
  mHead.setPointerCapture(e.pointerId);
});
mHead.addEventListener('pointermove', e => {
  if (!isDragging) return;
  mini.style.right = 'auto';
  mini.style.left = clamp(e.clientX - mDrag.dx, 0, vw - mini.offsetWidth) + 'px';
  mini.style.top = clamp(e.clientY - mDrag.dy, 0, vh - mini.offsetHeight) + 'px';
});
['pointerup', 'pointercancel'].forEach(ev => mHead.addEventListener(ev, () => isDragging = false));

$('mPip').addEventListener('click', () => {
  if (window.AndroidBridge) window.AndroidBridge.startOverlay();
});
$('mCollapse').addEventListener('click', () => {
  const c = mini.classList.toggle('collapsed');
  $('mCollapse').textContent = c ? '+' : '–';
});
$('mClose').addEventListener('click', () => { mini.classList.remove('show'); });
$('btnPip').addEventListener('click', () => { mini.classList.add('show'); });

// الجيروسكوب
let gyroBase = null, lastGyroInject = 0;
function onOrient(e) {
  if (e.beta === null || e.gamma === null) return;
  if (!gyroBase) { gyroBase = { beta: e.beta, gamma: e.gamma }; return; }
  const now = performance.now();
  if (now - lastGyroInject > 100) {
    let dX = e.gamma - gyroBase.gamma, dY = e.beta - gyroBase.beta;
    if (Math.abs(dX) > 1 || Math.abs(dY) > 1) {
      if (window.NativeOverlay) {
        window.NativeOverlay.injectSwipe(Math.round(vw/2), Math.round(vh/2), Math.round(vw/2 + (dX * 8)), Math.round(vh/2 + (dY * 8)), 50);
      }
      gyroBase = { beta: e.beta, gamma: e.gamma }; lastGyroInject = now;
    }
  }
}

document.querySelectorAll('.btn-gyro').forEach(btn => btn.addEventListener('click', async () => {
  if (!state.gyroOn) {
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      try { if ((await DeviceOrientationEvent.requestPermission()) !== 'granted') return; } catch (_) { return; }
    }
    gyroBase = null; window.addEventListener('deviceorientation', onOrient); state.gyroOn = true;
  } else {
    window.removeEventListener('deviceorientation', onOrient); state.gyroOn = false;
  }
  document.querySelectorAll('.btn-gyro').forEach(b => {
    b.textContent = 'GYRO AIM: ' + (state.gyroOn ? 'ON' : 'OFF');
    b.classList.toggle('on', state.gyroOn);
  });
  $('hudGyro').textContent = state.gyroOn ? 'ON' : 'OFF';
}));

function boot() {
  if (booted) return; booted = true;
  resize(); state.fireBtnY = vh - 150; applyFireBtnPosition();
  setBtnState('FREE'); requestAnimationFrame(loop);
}
window.addEventListener('load', boot);
</script>
</body>
</html>
